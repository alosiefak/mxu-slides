[package]
name = "mxu-automerge-ffi"
version = "1.0.0"
edition = "2021"
publish = false
description = "A small C interface to the automerge crate, for MxU Slides for Windows (library sync with the Mac)"

[lib]
name = "mxu_automerge"
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
automerge = { version = "=0.7.2", default-features = false }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.117"
hex = "0.4.3"

# A release build is what ships: fully optimised, one codegen unit, and panics that unwind so
# every exported function can catch them instead of crashing the app.
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = "symbols"
